# Trend-following paper profili.
# Bu dosya mevcut live-follower-pool ayarlarini degistirmez; acikca
# RTC_LAUNCH_CONF ile secilmedikce kullanilmaz.
TRADING_MODE=Paper
LIVE_DRY_RUN=true

LIVE_STRATEGY=AUTO
STRATEGY_SELECT_EVAL=1
TREND_STRICT_MODE=1
TREND_STRICT_STRATEGY_POOL=SUPERTREND,EMA_CROSSOVER,DONCHIAN
SCALP_SWING_ENABLE=0
STRATEGY_POOL_BY_EXCHANGE=binance:SUPERTREND|EMA_CROSSOVER|DONCHIAN;mt5:SUPERTREND|EMA_CROSSOVER|MA_CROSSOVER;ibkr:SUPERTREND|EMA_CROSSOVER|DONCHIAN
# Paper karar evreni Binance olarak kalır; BIST ayrıca veri-only gözetim venue'su
# olarak kayıtlıdır. MT5/IBKR bridge sahipliği ve execution izolasyonu korunur.
VENUES=binance:futures,bist:spot
TRADE_EXCHANGE=binance
TRADE_MARKET=futures
PINNED_SYMBOLS=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,LINKUSDT,XRPUSDT
AUTO_BINANCE_SYMBOLS=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,LINKUSDT,XRPUSDT
AUTO_BIST_SYMBOLS=THYAO@bist,ASELS@bist,EREGL@bist
PAPER_SYMBOLS=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,LINKUSDT,XRPUSDT
SCREENER_SYMBOLS=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,LINKUSDT,XRPUSDT
METRICS_PORT=9102

TRADE_INTERVAL=1h
AUTO_INTERVAL_CANDIDATES=1h,4h,1d
SCREENER_MIN_SCORE=0.35
SCREENER_TOP_N=8
MULTI_TF_ENABLED=1
# Candle DB ortak: canlı motor tek yazıcı olarak kalır; paper yalnızca okur.
MULTI_TF_DOWNLOAD=0
DOWNLOAD_ENABLED=0

# Candle DB ortak tutulur; runtime/state DB'si paper profile'e ozeldir.
DB_PATH=data/trader.db
STATE_DB_PATH=data/profiles/trend-following-paper-trend.db
SNAPSHOT_PATH=data/profiles/trend-following-paper-trend-snapshot.json
HEARTBEAT_PATH=logs/trend-following-paper-trend/heartbeat.jsonl
TRADING_LOG_PATH=logs/trend-following-paper-trend/robotic_trading.log
TRADES_LOG_PATH=logs/trend-following-paper-trend/trades.jsonl
ENGINE_PID_PATH=logs/trend-following-paper-trend/.engine.pid
ENGINE_STDOUT_PATH=logs/trend-following-paper-trend/engine_stdout.log
ENGINE_STDERR_PATH=logs/trend-following-paper-trend/engine_stderr.log
