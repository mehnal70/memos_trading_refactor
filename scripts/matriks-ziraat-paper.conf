# MatriksIQ + Ziraat hazırlık profili.
# Tüm mevcut venue'leri aynı registry'de tutar; gerçek emir göndermez.
TRADING_MODE=Paper
LIVE_DRY_RUN=true

# MatriksIQ Windows VM bridge'i hazır olduğunda kullanılacak adres.
# Protokol doğrulanana kadar motorun canlı execution yolu bu değeri kullanmaz.
MATRIKS_ENABLED=1
MATRIKS_READ_ONLY=1
MATRIKS_EXECUTION_ENABLED=0
# Windows VM'nin Tailscale adresi doğrulanınca 127.0.0.1 yerine onu yazın.
MATRIKS_BRIDGE_ADDR=127.0.0.1:9010
# Kullanıcının C# listener'ı için ayrı raw TCP endpoint; engine bu porta emir göndermez.
MATRIKS_ORDER_BRIDGE_ADDR=127.0.0.1:9000
MATRIKS_BRIDGE_PROTOCOL=ndjson-v1

# Analist REST metadata için yalnızca ortam değişkenleri kullanın.
# JWT veya discovery adresini bu profile yazmayın.
# MATRIKS_ANALIST_DISCOVERY_URL=https://<discovery-endpoint>
# MATRIKS_ANALIST_JWT_ENV=MATRIKS_ANALIST_JWT
# MATRIKS_ANALIST_MARKET_CODE=BIST
# MATRIKS_ANALIST_EXCHANGE_ID=4
# MATRIKS_ANALIST_SYMBOL=THYAO

LIVE_STRATEGY=AUTO
TREND_STRICT_MODE=1
TREND_STRICT_STRATEGY_POOL=SUPERTREND,EMA_CROSSOVER,DONCHIAN
SCALP_SWING_ENABLE=0

VENUES=binance:futures,mt5:cfd,ibkr:cfd,bist:spot
TRADE_EXCHANGE=binance
TRADE_MARKET=futures
TRADE_SYMBOL=BTCUSDT@binance
TRADE_INTERVAL=1h
PINNED_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance,EURUSD@mt5,XAUUSD@mt5,XLE@ibkr,TLT@ibkr,THYAO@bist,ASELS@bist,EREGL@bist
AUTO_BINANCE_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance
AUTO_MT5_SYMBOLS=EURUSD@mt5,XAUUSD@mt5
AUTO_IBKR_SYMBOLS=XLE@ibkr,TLT@ibkr
AUTO_BIST_SYMBOLS=THYAO@bist,ASELS@bist,EREGL@bist
PAPER_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance,EURUSD@mt5,XAUUSD@mt5,XLE@ibkr,TLT@ibkr,THYAO@bist,ASELS@bist,EREGL@bist
SCREENER_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance,EURUSD@mt5,XAUUSD@mt5,XLE@ibkr,TLT@ibkr,THYAO@bist,ASELS@bist,EREGL@bist

# BIST kapalı günlerinde taze veri beklenmez; download canlı motor tarafından yapılmaz.
DOWNLOAD_ENABLED=0
MULTI_TF_DOWNLOAD=0
MULTI_TF_ENABLED=1
AUTO_INTERVAL_CANDIDATES=1h,4h,1d

DB_PATH=data/trader.db
STATE_DB_PATH=data/profiles/matriks-ziraat-paper.db
SNAPSHOT_PATH=data/profiles/matriks-ziraat-paper-snapshot.json
HEARTBEAT_PATH=logs/matriks-ziraat-paper/heartbeat.jsonl
TRADING_LOG_PATH=logs/matriks-ziraat-paper/robotic_trading.log
TRADES_LOG_PATH=logs/matriks-ziraat-paper/trades.jsonl
ENGINE_PID_PATH=logs/matriks-ziraat-paper/.engine.pid
ENGINE_STDOUT_PATH=logs/matriks-ziraat-paper/engine_stdout.log
ENGINE_STDERR_PATH=logs/matriks-ziraat-paper/engine_stderr.log
METRICS_PORT=9103
