# paper-blend — Paper, XS⊕carry HARMAN market-nötr kitabı (w*≈0.6 carry; faithful sizing).
TRADING_MODE=Paper
LIVE_DRY_RUN=true
STARTING_CAPITAL=1000
STATE_DB_PATH=data/profiles/paper-blend.db
HEARTBEAT_PATH=logs/paper-blend/heartbeat.jsonl
SNAPSHOT_PATH=data/profiles/paper-blend-snapshot.json
# Hibrit: blend trade evreni Binance futures, MT5 ise ayrik veri/venue kanali.
VENUES=binance:futures,mt5:cfd
MT5_BRIDGE_ADDR=127.0.0.1:9001
XS_LIVE_ENABLED=0
CARRY_LIVE_ENABLED=0
BLEND_LIVE_ENABLED=1
# Saf book P&L: genel (edge'siz) motoru sustur → yalnız kitap işler.
SCREENER_TOP_N=0
# Hibritte eski DB sembollerinin orkestratore geri enjekte olmasini engelle.
ELITE_SYMBOL_HARVEST_ENABLED=0
# Blend islem evreninden bagimsiz MT5 veri kanali (autonomy sync) sembol seti.
AUTO_MT5_SYMBOLS=EURUSD@mt5,GBPUSD@mt5,USDJPY@mt5,AUDUSD@mt5,USDCAD@mt5,USDCHF@mt5,XAUUSD@mt5,XAGUSD@mt5
AUTO_MT5_COUNT=1000
AUTO_MT5_BOOTSTRAP=1
AUTO_MT5_BOOTSTRAP_COUNT=1000
AUTO_REQUIRE_MT5_ESTAB=1
AUX_RESEARCH_ENABLED=1
AUX_RESEARCH_MARKET=mt5
AUX_RESEARCH_INTERVAL=1h
AUX_RESEARCH_SYMBOLS=EURUSD,GBPUSD,USDJPY,XAUUSD
AUX_RESEARCH_MIN_BARS=300
AUX_RESEARCH_LIMIT=2000
# Seans gecisi firsatlarini kacirmamak icin handoff (Asya->Avrupa->ABD).
# autonomy cycle bu setleri UTC saate gore PINNED_SYMBOLS'e uygular.
AUTO_SESSION_HANDOFF=1
SESSION_CORE_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance
SESSION_ASIA_SYMBOLS=USDJPY@mt5,AUDUSD@mt5,XAUUSD@mt5
SESSION_ASIA_EU_OVERLAP_SYMBOLS=USDJPY@mt5,EURUSD@mt5,GBPUSD@mt5,XAUUSD@mt5
SESSION_EU_SYMBOLS=EURUSD@mt5,GBPUSD@mt5,USDCHF@mt5,XAUUSD@mt5
SESSION_EU_US_OVERLAP_SYMBOLS=EURUSD@mt5,GBPUSD@mt5,USDCAD@mt5,USDCHF@mt5,XAUUSD@mt5
SESSION_US_SYMBOLS=USDCAD@mt5,EURUSD@mt5,USDCHF@mt5,XAUUSD@mt5
SESSION_OFFHOURS_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance,SOLUSDT@binance,USDJPY@mt5,XAUUSD@mt5
# Seans degisimlerini hizli yakalamak icin sync scheduler aktif.
SCHEDULER_SYNC_EXCHANGE_ENABLED=1
SCHEDULER_SYNC_EXCHANGE_EVERY_MINS=10
SCHEDULER_SYNC_EXCHANGE_WARMUP=1
BLEND_LIVE_SYMBOLS=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,LTCUSDT,BCHUSDT,DOTUSDT
BLEND_LIVE_INTERVAL=1d
BLEND_LIVE_WEIGHT_MOM=0.4
BLEND_LIVE_WEIGHT_CARRY=0.6
BLEND_LIVE_TOP_K=3
BLEND_LIVE_REBALANCE_BARS=14
BLEND_LIVE_POSITION_PCT=0.10
BLEND_LIVE_LEVERAGE=1
BLEND_LIVE_REGIME_GATE=1
# Blend cekirdegi aktifken scalp/swing yalniz kontrollu overlay olarak acilsin.
BLEND_OVERLAY_ENABLE=1
BLEND_OVERLAY_MAX_OPEN=2
BLEND_OVERLAY_MAX_NET_DELTA=1
BLEND_OVERLAY_MAX_HOLDING_SECS=14400
SCALP_SWING_MEM15M_ENABLE=1
SCALP_SWING_MEM15M_MIN_BARS=20
SCALP_SWING_MEM15M_BIAS_WEIGHT=0.20
# Risk (XS ile hizalı): -8% kitap-DD devre kesici, +10% portföy TP, 1h cooldown.
BLEND_LIVE_MAX_DD_PCT=8
BLEND_LIVE_CB_COOLDOWN_SECS=3600
BLEND_LIVE_TP_PCT=10
# Maker icra: doğrulanmış NET edge maker fee'de.
USE_LIMIT_ENTRY=1

# A.5.3 pilot: symbolic gate opt-in, kontrollu kapsam (4 sembol).
SYMBOLIC_GATING_ENABLE=1
SYMBOLIC_GATING_MIN_CONF=0.75
SYMBOLIC_GATING_SYMBOLS=BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
SYMBOLIC_GATING_ADAPTIVE=1
SYMBOLIC_GATING_ADAPTIVE_MIN_CONF=0.68
SYMBOLIC_GATING_ADAPTIVE_MAX_CONF=0.88
SYMBOLIC_GATING_TARGET_ALIGNMENT_PCT=55

# Saf book modunda screener gürültüsünü kapat; research ML/backtest periyodik açık.
SCHEDULER_SCREENER_ENABLED=0
SCHEDULER_ML_ENABLED=1
SCHEDULER_ML_EVERY_MINS=180
SCHEDULER_ML_WARMUP_SKIP=0
SCHEDULER_BACKTEST_EVERY_MINS=360
SCHEDULER_BACKTEST_WARMUP=1
ANOMALY_ML_TRIGGER_COOLDOWN_SECS=86400

# Walk-forward aday eliminasyonu (fallback korumali):
# Tum adaylar elenirse sistem eski davranisa otomatik duser.
BACKTEST_ELIMINATION_ENABLED=1
BACKTEST_ELIM_MIN_CONSISTENCY_PCT=8
BACKTEST_ELIM_MIN_WINDOWS=24
BACKTEST_ELIM_MIN_OOS_SHARPE=-0.05
BACKTEST_ELIM_MIN_SCORE=0.00
BACKTEST_ELIM_MIN_TRADES=40
BACKTEST_ELIM_MAX_BINOM_PVALUE=0.20
BACKTEST_ELIM_BOOTSTRAP_ENABLED=1
BACKTEST_ELIM_BOOTSTRAP_SAMPLES=300
BACKTEST_ELIM_BOOTSTRAP_CI_PCT=5
BACKTEST_ELIM_BOOTSTRAP_MIN_MEAN_PNL_PCT=-0.10

# Backtest eliminasyon kapisi (env-tabanli): zayif adaylari canli secimden once ele.
BACKTEST_ELIMINATION_ENABLED=1
BACKTEST_ELIM_MIN_CONSISTENCY_PCT=8
BACKTEST_ELIM_MIN_WINDOWS=24
BACKTEST_ELIM_MIN_OOS_SHARPE=-0.05
BACKTEST_ELIM_MIN_SCORE=0.00
