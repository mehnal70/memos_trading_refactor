# live-follower-pool — GERÇEK PARA trade follower + çoklu venue havuzu
TRADING_MODE=Live
LIVE_DRY_RUN=false
STARTING_CAPITAL=1000
# Global equity/PnL KPI'sinde yalnızca reel işlem venue'u raporlanır.
REAL_EQUITY_VENUE=binance
REAL_PNL_BASELINE_USD=11.20482177

# Havuz: Binance + MT5 + IBKR
TRADE_MARKET=futures
VENUES=binance:futures,mt5:cfd,ibkr:cfd
IBKR_ENABLED=1
IBKR_EXECUTION_ENABLED=0
IBKR_API_HOST=127.0.0.1
IBKR_API_PORT=4002
IBKR_BRIDGE_ADDR=127.0.0.1:9101

# Sembol yönlendirme açık etiketli
# 20'lik çeşitlendirilmiş trade-follower havuzu:
# - Binance: majör kripto + farklı alt-temalar
# - MT5: majör FX + altın
# - IBKR: sektör ETF'leri + tahvil/emtia ETF'leri
PINNED_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance,BNBUSDT@binance,SOLUSDT@binance,LINKUSDT@binance,XRPUSDT@binance,EURUSD@mt5,USDJPY@mt5,GBPUSD@mt5,AUDUSD@mt5,USDCHF@mt5,USDCAD@mt5,XAUUSD@mt5,XLE@ibkr,XLV@ibkr,XLU@ibkr,XLF@ibkr,XLI@ibkr,TLT@ibkr,DBA@ibkr
AUTO_BINANCE_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance,BNBUSDT@binance,SOLUSDT@binance,LINKUSDT@binance,XRPUSDT@binance
# Kontrollü keşif: yalnız TRADING/PERPETUAL/USDT ve yüksek 24s quote-volume adayları.
# Pinned liste korunur; keşfedilen aday sayısı ayrıca üstten sınırlıdır.
AUTO_BINANCE_DISCOVERY_ENABLED=1
AUTO_BINANCE_DISCOVERY_MAX=4
AUTO_BINANCE_DISCOVERY_MIN_QUOTE_VOLUME=25000000
SCHEDULER_SYMSTATUS_EVERY_MINS=5
AUTO_MT5_SYMBOLS=EURUSD@mt5,USDJPY@mt5,GBPUSD@mt5,AUDUSD@mt5,USDCHF@mt5,USDCAD@mt5,XAUUSD@mt5
AUTO_MT5_DISCOVERY_SYMBOLS=EURUSD,GBPUSD,USDJPY,AUDUSD,USDCHF,USDCAD,XAUUSD,XAGUSD,US30,NAS100,GER40
AUTO_IBKR_SYMBOLS=XLE@ibkr,XLV@ibkr,XLU@ibkr,XLF@ibkr,XLI@ibkr,TLT@ibkr,DBA@ibkr
AUTO_IBKR_DISCOVERY_SYMBOLS=SPY,QQQ,IWM,GLD,SLV,XLE,XLV,XLU,XLF,XLI,TLT,DBA
TRADE_SYMBOL=BTCUSDT@binance
TRADE_INTERVAL=1h
LIVE_STRATEGY=EMA_CROSSOVER
LIVE_STRATEGY_PARAMS=fast=50,slow=100,htf_fast=50,htf_slow=100
OPPORTUNITY_PARAM_ADAPT=0
TREND_STRICT_MODE=1
TREND_STRICT_STRATEGY_POOL=EMA_CROSSOVER
REGIME_DIRECTIONAL=1
REGIME_STRATEGY_FIT=1

# Adanmış kitaplar kapalı
XS_LIVE_ENABLED=0
CARRY_LIVE_ENABLED=0
BLEND_LIVE_ENABLED=0

# İlk giriş küçük, eklemeler kontrollü
BASE_ALLOC_FRACTION=0.01
ALLOC_FLOOR_FRACTION=1.00
LIVE_MAX_NOTIONAL_USD=9

# Venue bazli koruma (toplam acik pozisyon ve gunluk zarar)
VENUE_MAX_CONCURRENT_OPEN=binance:4,mt5:3,ibkr:3
VENUE_DAILY_LOSS_PCT=binance:1.0,mt5:1.0,ibkr:1.0

# Henry tipi pyramiding
GRADED_ENTRY_ENABLED=1
GRADED_TRANCHE_WEIGHTS=1.0,0.5,0.25
GRADED_WEIGHT_MODE=relative
GRADED_TRIGGER_MODE=hybrid
GRADED_TRIGGER_ATR_MULT=1.0
GRADED_FAVORABLE_MOVE_PCT=5.0
GRADED_ADVERSE_MOVE_PCT=1.0
GRADED_REQUIRE_HTF=1
GRADED_PYRAMIDING_ONLY=1

LET_WINNERS_RUN=1
TARGET_TRAIL_PCT=1.5
TARGET_TRAIL_PCT_BY_EXCHANGE=binance:2.0,mt5:1.1,ibkr:1.4
GRADED_TRIGGER_ATR_MULT_BY_EXCHANGE=binance:1.4,mt5:0.8,ibkr:1.0
GRADED_FAVORABLE_MOVE_PCT_BY_EXCHANGE=binance:6.0,mt5:3.0,ibkr:4.0
GRADED_ADVERSE_MOVE_PCT_BY_EXCHANGE=binance:1.2,mt5:0.8,ibkr:1.0
FALLBACK_SL_PCT=1.5
FALLBACK_TP_PCT=6.0

STATE_DB_PATH=data/profiles/live-follower-pool.db
HEARTBEAT_PATH=logs/live-follower-pool/heartbeat.jsonl
SNAPSHOT_PATH=data/profiles/live-follower-pool-snapshot.json
