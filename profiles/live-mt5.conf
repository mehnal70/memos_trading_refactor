# 🔴 live-mt5 — MetaTrader 5 Köprüsü Üzerinden GERÇEK PARA Forex/CFD Operasyonu
TRADING_MODE=Live
LIVE_DRY_RUN=false
SCHEDULER_SYNC_EXCHANGE_ENABLED=1
SCHEDULER_SYNC_EXCHANGE_EVERY_MINS=10
SCHEDULER_SYNC_EXCHANGE_WARMUP=1
SCHEDULER_SCREENER_ENABLED=0
SCHEDULER_ML_ENABLED=0
SCHEDULER_ML_WARMUP_SKIP=1
ANOMALY_ML_TRIGGER_COOLDOWN_SECS=86400
AUTO_FORCE_CLOSE_ENABLED=0
AUTO_FORCE_CLOSE_PHASE=E5_RiskOn
AUTO_FORCE_CLOSE_COOLDOWN_MINS=15

# [İSİMLENDİRME ENTEGRASYONU]: Hesap izolasyonu için anayasal DB_PATH tanımları 🎯
DB_PATH=data/profiles/live-mt5.db
HEARTBEAT_PATH=logs/live-mt5/heartbeat.jsonl
SNAPSHOT_PATH=data/profiles/live-mt5-snapshot.json

# Venue ve evren MT5-only olsun; _base'den kripto sembol karismasin.
VENUES=mt5:cfd
TRADE_EXCHANGE=mt5
TRADE_MARKET=cfd
TRADE_INTERVAL=1h
TRADE_SYMBOL=EURUSD@mt5
PINNED_SYMBOLS=EURUSD@mt5,GBPUSD@mt5,USDJPY@mt5,AUDUSD@mt5,USDCAD@mt5,USDCHF@mt5,XAUUSD@mt5,XAGUSD@mt5
ELITE_SYMBOL_HARVEST_ENABLED=0

# Otonom Kitap Muafiyetleri (XS/Carry/Blend Kriptoya Özgüdür, Burada Kapatılır)
XS_LIVE_ENABLED=0
CARRY_LIVE_ENABLED=0
BLEND_LIVE_ENABLED=0
SCREENER_TOP_N=0
SCREENER_MIN_VOLUME=0
SEED_STRATEGY_PRIORITY=0
EDGE_SEED_REPORT=
PARAM_SWEEP_REPORT=
