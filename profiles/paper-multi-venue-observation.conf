# paper-multi-venue-observation — ortak gözlem/validasyon koordinatörü.
#
# Bu profil gerçek execution açmaz. Venue engine'leri kendi izole kaynak
# profillerini kullanır: paper-binance-testnet, paper-mt5 ve paper-ibkr.
# Bu dosya ortak audit, profile-scoped readiness ve validasyon kapsamını
# tanımlar; venue'ye özel sembol/market ayarlarını override etmez.

TRADING_MODE=Paper
LIVE_DRY_RUN=true
LIVE_EXECUTION_ARMED=0
LIVE_GO_NO_GO=NO_GO

VENUES=binance:futures,mt5:cfd,ibkr:cfd,bist:spot
PINNED_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance,BNBUSDT@binance,SOLUSDT@binance,LINKUSDT@binance,XRPUSDT@binance,EURUSD@mt5,GBPUSD@mt5,USDJPY@mt5,AUDUSD@mt5,USDCAD@mt5,USDCHF@mt5,XAUUSD@mt5,XAGUSD@mt5,XLE@ibkr,XLV@ibkr,XLU@ibkr,XLF@ibkr,XLI@ibkr,TLT@ibkr,DBA@ibkr,CCOLA@bist,FROTO@bist,GARAN@bist,THYAO@bist,TOASO@bist,AKBNK@bist,ASELS@bist,TRALT@bist,KTLEV@bist,ZOREN@bist,HEKTS@bist,KRDMD@bist,EREGL@bist,YKBNK@bist,ASTOR@bist,EKGYO@bist,PETKM@bist,ESEN@bist,ISCTR@bist,MIATK@bist

# Ortak risk kapıları: execution yetkisi verilmeden de audit edilebilir.
LIVE_MAX_NOTIONAL_USD=0
VENUE_MAX_CONCURRENT_OPEN=binance:1,mt5:3,ibkr:1,bist:0
VENUE_DAILY_LOSS_PCT=binance:1.0,mt5:1.0,ibkr:1.0,bist:0.0
XS_LIVE_ENABLED=0
CARRY_LIVE_ENABLED=0
BLEND_LIVE_ENABLED=0

# IBKR yalnızca read-only hesap/market-data gözlemi.
IBKR_ENABLED=1
IBKR_READ_ONLY=1
IBKR_EXECUTION_ENABLED=0
IBKR_BRIDGE_ADDR=127.0.0.1:9101
IBKR_API_HOST=127.0.0.1
IBKR_API_PORT=4002

# BIST yalnızca Google Sheets verisi ve sinyal gözlemi için kullanılır.
BIST_SHEETS_ENABLED=1
BIST_DATA_PROVIDER=google_sheets
BIST_SHEETS_REQUIRE_MATCH=1
BIST_EXECUTION_ENABLED=0

# Ortak profile generic motorla doğrudan çalıştırılmamalıdır; venue_engine.sh
# her venue için yukarıdaki izole kaynak profillerini seçer.
PROFILE_ROLE=observation-coordinator
