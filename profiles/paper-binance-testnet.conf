# Binance Futures Testnet — yalnızca kontrollü preflight/paper profili.
# API anahtarları bu dosyada değil, kök .env içinde tutulur.
TRADING_MODE=Live
LIVE_DRY_RUN=true
BINANCE_TESTNET=1
STARTING_CAPITAL=1000
# Varsayılan generic headless motoru MT5 venue engine'inin 9100 metrics portuyla
# çakışmasın; izole Binance engine'i venue_engine.sh tarafından 9300'e taşınır.
METRICS_PORT=9500

VENUES=binance:futures
PRICE_POLL_SECS=15
AUTO_MT5_CHECK_ENABLED=0
ELITE_SYMBOL_HARVEST_ENABLED=0
TRADE_EXCHANGE=binance
TRADE_MARKET=futures
TRADE_SYMBOL=BTCUSDT@binance
BINANCE_EXECUTION_SYMBOL_ALLOWLIST=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,LINKUSDT,XRPUSDT
TRADE_INTERVAL=15m
PINNED_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance,BNBUSDT@binance,SOLUSDT@binance,LINKUSDT@binance,XRPUSDT@binance
PAPER_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance,BNBUSDT@binance,SOLUSDT@binance,LINKUSDT@binance,XRPUSDT@binance
AUTO_BINANCE_SYMBOLS=BTCUSDT@binance,ETHUSDT@binance,BNBUSDT@binance,SOLUSDT@binance,LINKUSDT@binance,XRPUSDT@binance
# Binance evreni sabit kalır; MT5/FX seans handoff'u bu profile uygulanmaz.
AUTO_SESSION_HANDOFF=0
AUTO_OPPORTUNITY_MAX=0
# Engine'in Binance için kullandığı varsayılan AUTO havuzu açıkça belirtilir.
# STRATEGY_SELECT_EVAL=0 olduğundan ek seçim/backtest davranışı devreye girmez.
STRATEGY_BY_EXCHANGE=binance:AUTO
STRATEGY_POOL_BY_EXCHANGE=binance:EMA_CROSSOVER|DONCHIAN|SUPERTREND
GRADED_ENTRY_ENABLED=1
GRADED_TRANCHE_WEIGHTS=1.0,0.5,0.25
GRADED_TRIGGER_MODE=hybrid
GRADED_TRIGGER_ATR_MULT=1.0
GRADED_FAVORABLE_MOVE_PCT=5.0
GRADED_ADVERSE_MOVE_PCT=1.0
GRADED_REQUIRE_HTF=1
GRADED_PYRAMIDING_ONLY=1
AUTO_BINANCE_DISCOVERY_ENABLED=0
AUTO_MT5_SYMBOLS=
AUTO_IBKR_SYMBOLS=
AUTO_BIST_SYMBOLS=

BLEND_LIVE_ENABLED=0
XS_LIVE_ENABLED=0
CARRY_LIVE_ENABLED=0
SCREENER_TOP_N=0
SCHEDULER_SCREENER_ENABLED=0
SCHEDULER_ML_ENABLED=0
USE_LIMIT_ENTRY=0
LIVE_MAX_NOTIONAL_USD=10
VENUE_MAX_CONCURRENT_OPEN=binance:1
VENUE_DAILY_LOSS_PCT=binance:1.0
# Venue adapter varsayılanlarıyla aynı; paper soak davranışını değiştirmeden
# risk/pyramid politikasını profile açıkça mühürler.
PYRAMID_MAX_TRANCHES_BY_EXCHANGE=binance:4
PYRAMID_MAX_ATR_PCT_BY_EXCHANGE=binance:5.0
MAIN_LOOP_STALL_SECS=15
STRATEGY_SELECT_EVAL=0

STATE_DB_PATH=data/profiles/paper-binance-testnet.db
SNAPSHOT_PATH=data/profiles/paper-binance-testnet-snapshot.json
HEARTBEAT_PATH=logs/paper-binance-testnet/heartbeat.jsonl
TRADING_LOG_PATH=logs/paper-binance-testnet/robotic_trading.log
TRADES_LOG_PATH=logs/paper-binance-testnet/trades.jsonl
